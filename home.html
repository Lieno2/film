<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link href="style.css" rel="stylesheet">    
</head>

<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#home">FILM TRACKER</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#addForm">Aggiungi Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="#displayFilm">I Tuoi Film</a></li>

                </ul>
            </div>
        </div>
    </nav>
    
    <main>
        <!-- Home Section -->
        <section id="home" class="page min-vh-100 d-flex align-items-center text-center">
            <div class="container">
                <h1 class="display-5 fw-bold mb-3">Welcome to Film Tracker</h1>
                <p class="lead mb-4">Traccia i film che hai visto, gestisci le statistiche e ricevi consigli da Gemini.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="#addForm" class="btn btn-light">Aggiungi un film</a>
                    <a href="#displayFilm" class="btn btn-outline-light">Mostra la tua lista</a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
